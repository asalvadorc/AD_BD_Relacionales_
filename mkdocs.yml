site_url : https://asalvadorc.github.io/AD_BD_Relacionales_

site_name: AD - Acceso a Datos - Bases de Datos Relacionales
# Material reservado: permanece en el repositorio, pero MkDocs no lo publica.
exclude_docs: |
  Examen.md

copyright: >
  © 2026 Alicia Salvador —
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">
  Licencia CC BY-NC-SA 4.0
  </a>

extra_css:
  - css/extra.css

extra_javascript:
  - js/lightbox.js

theme: 
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: img/favicon.ico
  features:
    - toc.follow
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - header.autohide
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - admonition
  - tables    
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true     
  - md_in_html
  - pymdownx.details
  - meta
  - toc:
      toc_depth: 2
      permalink: True

nav:

- 🏠 Inicio: 
  - index.md
  - 🔹RA y CE: RA_CE.md
  - 🔹Guía de estudio: Guia_estudio.md
- Contenido:
  - 🔹Introducción: Introduccion.md
  - 🔹Herramientas y Conectores: Conectores.md
  - 🔹Operaciones sobre la BD: Operaciones.md
  - 🔹Transacciones y control de errores: Transacciones.md
  - 🔹Funciones y Procedimientos almacenados: Procedimientos.md
  - 📝 Ejercicio obligatorio: Ejercicio.md
- Preparación de la BD geo: Docker_instrucciones.md
